[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spyder-claude"
version = "0.1.0.dev0"
description = "Run Claude Code inside Spyder, with access to your consoles, variables, plots and editor"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Spyder Project Contributors", email = "spyder.python@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "spyder>=6.2.0.dev0",
    "spyder-terminal>=1.4.0.dev0",
]

[project.urls]
Source = "https://github.com/andfoy/spyder-claude"
Issues = "https://github.com/andfoy/spyder-claude/issues"

[project.optional-dependencies]
test = ["pytest", "pytest-qt"]

[project.entry-points."spyder.plugins"]
claude_code = "spyder_claude.plugin:ClaudeCode"

[tool.setuptools.packages.find]
include = ["spyder_claude*"]
