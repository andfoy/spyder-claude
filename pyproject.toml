[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spyder-claude"
version = "0.1.0.dev0"
description = "Chat with Claude inside Spyder, with access to your consoles, variables, plots and editor"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "spyder>=6.2.0.dev0",
    "claude-agent-sdk>=0.2.167",
]

[project.optional-dependencies]
test = ["pytest", "pytest-qt"]

[project.entry-points."spyder.plugins"]
claude_agent = "spyder_claude.plugin:ClaudeAgent"

[tool.setuptools.packages.find]
include = ["spyder_claude*"]
