name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Spyder and spyder-terminal versions with what this plugin needs aren't
  # released yet, so they're installed from these branches
  SPYDER_REPO: https://github.com/andfoy/spyder.git
  SPYDER_BRANCH: mcp-server-prototype
  SPYDER_TERMINAL_REPO: https://github.com/andfoy/spyder-terminal.git
  SPYDER_TERMINAL_BRANCH: spyder-6.2-xterm6

jobs:
  tests:
    name: Linux, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      QT_API: pyqt5
      PYTEST_QT_API: pyqt5
      QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libgl1 libnss3 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-cursor0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        # To build spyder-terminal's web client
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Spyder
        run: |
          git clone --depth 1 --branch "$SPYDER_BRANCH" "$SPYDER_REPO" \
            "$RUNNER_TEMP/spyder"
          cd "$RUNNER_TEMP/spyder"
          python -m pip install -U pip setuptools wheel
          python -m pip install -e ".[test]"
          # Spyder's development version needs its subrepos (e.g.
          # spyder-kernels) from source, like in Spyder's CI
          python install_dev_repos.py --not-editable --no-install \
            spyder spyder-remote-services
          # Kernels crash with later versions (see Spyder's CI)
          python -m pip install ipykernel==7.2.0

      - name: Install spyder-terminal
        run: |
          git clone --depth 1 --branch "$SPYDER_TERMINAL_BRANCH" \
            "$SPYDER_TERMINAL_REPO" "$RUNNER_TEMP/spyder-terminal"
          cd "$RUNNER_TEMP/spyder-terminal"
          python setup.py build_static
          # Without dependencies, so Spyder's development version stays
          python -m pip install --no-deps .
          python -m pip install coloredlogs requests terminado tornado pexpect

      - name: Install spyder-claude
        # Its test dependencies come with Spyder's
        run: python -m pip install --no-deps -e .

      - name: Show environment
        run: python -m pip list

      - name: Run tests
        # QtWebEngine may crash when the test process exits, so the
        # results come from the JUnit report instead of the exit code
        run: |
          xvfb-run --auto-servernum python -m pytest spyder_claude/tests \
            -v -p no:cacheprovider --junitxml=junit.xml || true
          python .github/scripts/check_junit.py junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-py${{ matrix.python-version }}
          path: junit.xml
          if-no-files-found: ignore
